name: OmniPilot CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Lint & Unit/E2E Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Core Dependencies
        run: npm ci

      - name: Install Playwright Headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Web Control Dashboard
        run: cd web-dashboard && npm ci && npm run build

      - name: Verify TypeScript Compilation (Strict Mode)
        run: npm run build

      - name: Run Complete Test Suite (Unit + E2E + Red-Team Security)
        run: npm test

      - name: Execute E2E CLI Showcase Runner
        run: npx tsx src/cli.ts
